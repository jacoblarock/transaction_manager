<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Transaction Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-secondary">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <a href="/static/groups.html" class="navbar-brand mb-0 h1">Transaction Manager</a>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Manage Users</h3>
            <a href="#" id="backLink" class="btn btn-outline-primary btn-sm">Back to Group</a>
        </div>

        <div class="row">
            <div class="col-md-6">
                <h5>Current Members</h5>
                <div id="memberList" class="list-group mb-3"></div>
            </div>
            <div class="col-md-6">
                <h5>Add User to Group</h5>
                <div id="addAlertBox"></div>
                <form id="addUserForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="addUsername" placeholder="Enter username">
                    </div>
                    <button type="submit" class="btn btn-primary">Add User</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        (async () => {
        if (!await requireAuth()) return;
        const params = new URLSearchParams(window.location.search);
        const groupId = params.get("groupId");
        if (!groupId) window.location.href = "/static/groups.html";

        document.getElementById("backLink").href = `/static/group.html?groupId=${groupId}`;

        let currentUserId = null;

        async function getCurrentUser() {
            try {
                const resp = await fetch(`/api/auth_check?token=${encodeURIComponent(getToken())}`);
                if (!resp.ok) { logout(); return; }
            } catch {}
        }

        async function loadMembers() {
            try {
                const users = await apiGet("/api/get_group_users", { groupId });
                const container = document.getElementById("memberList");
                if (users.length === 0) {
                    container.innerHTML = `<p class="text-body-secondary">No members.</p>`;
                    return;
                }
                container.innerHTML = users.map(u => `
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <span>${escapeHtml(u.u_name)}</span>
                        <button class="btn btn-outline-danger btn-sm" onclick="removeUser(${u.u_id}, '${escapeHtml(u.u_name)}')" ${users.length <= 1 ? 'disabled title="Cannot remove last user"' : ''}>Remove</button>
                    </div>
                `).join("");
            } catch (err) {
                document.getElementById("memberList").innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        }

        document.getElementById("addUserForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("addUsername").value.trim();
            const alertBox = document.getElementById("addAlertBox");
            alertBox.innerHTML = "";
            if (!username) { alertBox.innerHTML = `<div class="alert alert-danger">Please enter a username.</div>`; return; }
            try {
                const idResp = await fetch(`/api/get_user_id?token=${encodeURIComponent(getToken())}&user=${encodeURIComponent(username)}`);
                const idText = await idResp.text();
                if (!idResp.ok) {
                    alertBox.innerHTML = `<div class="alert alert-danger">User "${escapeHtml(username)}" not found.</div>`;
                    return;
                }
                const resp = await fetch(`/api/add_user_to_group?token=${encodeURIComponent(getToken())}&userId=${idText}&groupId=${groupId}`);
                const text = await resp.text();
                if (resp.ok) {
                    document.getElementById("addUsername").value = "";
                    loadMembers();
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        });

        window.removeUser = async function(userId, userName) {
            if (!confirm(`Remove ${userName} from this group?`)) return;
            try {
                const resp = await fetch(`/api/remove_user_from_group?token=${encodeURIComponent(getToken())}&userId=${userId}&groupId=${groupId}`);
                const text = await resp.text();
                if (resp.ok) {
                    loadMembers();
                } else {
                    alert(`Error: ${text}`);
                }
            } catch (err) {
                alert(`Error: ${err.message}`);
            }
        };

        (async () => {
            await loadMembers();
        })();
        })();
    </script>
</body>
</html>
