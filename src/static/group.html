<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group - Transaction Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-secondary">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <a href="/static/groups.html" class="navbar-brand mb-0 h1">Transaction Manager</a>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 id="groupTitle">Group</h3>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-info btn-sm" id="settleBtn">Who Owes Whom</button>
                <button class="btn btn-outline-secondary btn-sm" id="manageUsersBtn">Manage Users</button>
                <button class="btn btn-success btn-sm" id="addTxnBtn">+ Transaction</button>
                <button class="btn btn-primary btn-sm" id="addPayBtn">+ Payment</button>
            </div>
        </div>

        <div id="settleResults" class="mb-3"></div>

        <h5>Activity Timeline</h5>
        <div id="timeline" class="list-group"></div>
    </div>

    <!-- Add Transaction Modal -->
    <div class="modal fade" id="addTxnModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Transaction</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="addTxnAlert"></div>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="txnName">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" step="0.01" class="form-control" id="txnAmount">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date (optional)</label>
                        <input type="date" class="form-control" id="txnDate">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="saveTxnBtn">Add</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Payment Modal -->
    <div class="modal fade" id="addPayModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Payment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="addPayAlert"></div>
                    <div class="mb-3">
                        <label class="form-label">Recipient</label>
                        <select class="form-select" id="payRecipient"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" step="0.01" class="form-control" id="payAmount">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date (optional)</label>
                        <input type="date" class="form-control" id="payDate">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="savePayBtn">Add</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Transaction Modal -->
    <div class="modal fade" id="editTxnModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Transaction</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="editTxnAlert"></div>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="editTxnName">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" step="0.01" class="form-control" id="editTxnAmount">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date (optional)</label>
                        <input type="date" class="form-control" id="editTxnDate">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger me-auto" id="deleteTxnBtn">Delete</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="updateTxnBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Payment Modal -->
    <div class="modal fade" id="editPayModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Payment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="editPayAlert"></div>
                    <div class="mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" step="0.01" class="form-control" id="editPayAmount">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date (optional)</label>
                        <input type="date" class="form-control" id="editPayDate">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger me-auto" id="deletePayBtn">Delete</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="updatePayBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        (async () => {
        if (!await requireAuth()) return;
        const params = new URLSearchParams(window.location.search);
        const groupId = params.get("groupId");
        if (!groupId) window.location.href = "/static/groups.html";

        let users = [];
        let currentUserId = null;
        let currentEditPayId = null;
        let currentEditTxnId = null;

        async function loadGroupInfo() {
            try {
                const groups = await apiGet("/api/get_groups");
                const g = groups.find(x => x.g_id == groupId);
                if (g) document.getElementById("groupTitle").textContent = g.g_name;
            } catch {}
        }

        async function loadUsers() {
            try {
                users = await apiGet("/api/get_group_users", { groupId });
                const me = users.find(u => u.u_name === getUsername());
                currentUserId = me ? me.u_id : null;
            } catch {
                users = [];
            }
        }

        function userName(uid) {
            const u = users.find(x => x.u_id == uid);
            return u ? u.u_name : `User ${uid}`;
        }

        async function loadTimeline() {
            try {
                const [txns, pays] = await Promise.all([
                    apiGet("/api/get_transactions", { groupId }),
                    apiGet("/api/get_payments", { groupId }),
                ]);
                const items = [];
                txns.forEach(t => items.push({
                    type: "transaction",
                    id: t.t_id,
                    user: t.t_u_ref,
                    name: t.t_name,
                    amount: t.t_amount,
                    date: t.t_date,
                    created_at: t.t_created_at,
                }));
                pays.forEach(p => items.push({
                    type: "payment",
                    id: p.p_id,
                    sender: p.p_u_sender,
                    recipient: p.p_u_recipient,
                    amount: p.p_amount,
                    date: p.p_date,
                    created_at: p.p_created_at,
                }));
                items.sort((a, b) => {
                    const d = new Date(b.date) - new Date(a.date);
                    if (d !== 0) return d;
                    return new Date(b.created_at) - new Date(a.created_at);
                });

                const container = document.getElementById("timeline");
                if (items.length === 0) {
                    container.innerHTML = `<p class="text-body-secondary">No activity yet.</p>`;
                    return;
                }
                container.innerHTML = items.map(item => {
                    if (item.type === "transaction") {
                        const isMine = currentUserId !== null && item.user == currentUserId;
                        const editBtn = isMine
                            ? `<button class="btn btn-outline-secondary btn-sm ms-2" onclick="openEditTransaction(${item.id}, '${escapeHtml(item.name)}', ${item.amount}, '${item.date}')">Edit</button>`
                            : "";
                        return `<div class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <span class="badge text-bg-success">Transaction</span>
                                <strong>${escapeHtml(item.name)}</strong> by ${escapeHtml(userName(item.user))}
                                <small class="text-body-secondary d-block">${formatDate(item.date)}</small>
                            </div>
                            <div class="d-flex align-items-center">
                                <span class="badge text-bg-primary fs-6">${formatAmount(item.amount)}</span>
                                ${editBtn}
                            </div>
                        </div>`;
                    } else {
                        const isMine = currentUserId !== null && item.sender == currentUserId;
                        const editBtn = isMine
                            ? `<button class="btn btn-outline-secondary btn-sm ms-2" onclick="openEditPayment(${item.id}, ${item.amount}, '${item.date}')">Edit</button>`
                            : "";
                        return `<div class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <span class="badge text-bg-info">Payment</span>
                                ${escapeHtml(userName(item.sender))} &rarr; ${escapeHtml(userName(item.recipient))}
                                <small class="text-body-secondary d-block">${formatDate(item.date)}</small>
                            </div>
                            <div class="d-flex align-items-center">
                                <span class="badge text-bg-warning fs-6">${formatAmount(item.amount)}</span>
                                ${editBtn}
                            </div>
                        </div>`;
                    }
                }).join("");
            } catch (err) {
                document.getElementById("timeline").innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        }

        document.getElementById("addTxnBtn").addEventListener("click", () => {
            document.getElementById("txnName").value = "";
            document.getElementById("txnAmount").value = "";
            document.getElementById("txnDate").value = "";
            document.getElementById("addTxnAlert").innerHTML = "";
            new bootstrap.Modal(document.getElementById("addTxnModal")).show();
        });

        document.getElementById("saveTxnBtn").addEventListener("click", async () => {
            const name = document.getElementById("txnName").value.trim();
            const amount = document.getElementById("txnAmount").value;
            const date = document.getElementById("txnDate").value;
            const alertBox = document.getElementById("addTxnAlert");
            alertBox.innerHTML = "";
            if (!name || !amount) { alertBox.innerHTML = `<div class="alert alert-danger">All fields required.</div>`; return; }
            try {
                let url = `/api/create_transaction?token=${encodeURIComponent(getToken())}&groupId=${groupId}&name=${encodeURIComponent(name)}&amount=${amount}`;
                if (date) url += `&date=${date}`;
                const resp = await fetch(url);
                const text = await resp.text();
                if (resp.ok) {
                    bootstrap.Modal.getInstance(document.getElementById("addTxnModal")).hide();
                    loadTimeline();
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        });

        document.getElementById("addPayBtn").addEventListener("click", async () => {
            document.getElementById("payAmount").value = "";
            document.getElementById("payDate").value = "";
            document.getElementById("addPayAlert").innerHTML = "";
            await loadUsers();
            const sel = document.getElementById("payRecipient");
            sel.innerHTML = users.map(u => `<option value="${u.u_id}">${escapeHtml(u.u_name)}</option>`).join("");
            new bootstrap.Modal(document.getElementById("addPayModal")).show();
        });

        document.getElementById("savePayBtn").addEventListener("click", async () => {
            const recipientId = document.getElementById("payRecipient").value;
            const amount = document.getElementById("payAmount").value;
            const alertBox = document.getElementById("addPayAlert");
            alertBox.innerHTML = "";
            if (!amount) { alertBox.innerHTML = `<div class="alert alert-danger">Amount required.</div>`; return; }
            try {
                let url = `/api/create_payment?token=${encodeURIComponent(getToken())}&groupId=${groupId}&recipientId=${recipientId}&amount=${amount}`;
                const date = document.getElementById("payDate").value;
                if (date) url += `&date=${date}`;
                const resp = await fetch(url);
                const text = await resp.text();
                if (resp.ok) {
                    bootstrap.Modal.getInstance(document.getElementById("addPayModal")).hide();
                    loadTimeline();
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        });

        window.openEditTransaction = function(txnId, name, amount, date) {
            currentEditTxnId = txnId;
            document.getElementById("editTxnName").value = name;
            document.getElementById("editTxnAmount").value = amount;
            document.getElementById("editTxnDate").value = toISODate(date);
            document.getElementById("editTxnAlert").innerHTML = "";
            new bootstrap.Modal(document.getElementById("editTxnModal")).show();
        };

        document.getElementById("updateTxnBtn").addEventListener("click", async () => {
            const name = document.getElementById("editTxnName").value.trim();
            const amount = document.getElementById("editTxnAmount").value;
            const date = document.getElementById("editTxnDate").value;
            const alertBox = document.getElementById("editTxnAlert");
            alertBox.innerHTML = "";
            if (!name || !amount) { alertBox.innerHTML = `<div class="alert alert-danger">All fields required.</div>`; return; }
            try {
                let url = `/api/update_transaction?token=${encodeURIComponent(getToken())}&transactionId=${currentEditTxnId}&name=${encodeURIComponent(name)}&amount=${amount}`;
                if (date) url += `&date=${date}`;
                const resp = await fetch(url);
                const text = await resp.text();
                if (resp.ok) {
                    bootstrap.Modal.getInstance(document.getElementById("editTxnModal")).hide();
                    loadTimeline();
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        });

        document.getElementById("deleteTxnBtn").addEventListener("click", async () => {
            const alertBox = document.getElementById("editTxnAlert");
            alertBox.innerHTML = "";
            try {
                const resp = await fetch(`/api/delete_transaction?token=${encodeURIComponent(getToken())}&transactionId=${currentEditTxnId}`);
                const text = await resp.text();
                if (resp.ok) {
                    bootstrap.Modal.getInstance(document.getElementById("editTxnModal")).hide();
                    loadTimeline();
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        });

        window.openEditPayment = function(payId, amount, date) {
            currentEditPayId = payId;
            document.getElementById("editPayAmount").value = amount;
            document.getElementById("editPayDate").value = toISODate(date);
            document.getElementById("editPayAlert").innerHTML = "";
            new bootstrap.Modal(document.getElementById("editPayModal")).show();
        };

        document.getElementById("updatePayBtn").addEventListener("click", async () => {
            const amount = document.getElementById("editPayAmount").value;
            const date = document.getElementById("editPayDate").value;
            const alertBox = document.getElementById("editPayAlert");
            alertBox.innerHTML = "";
            if (!amount) { alertBox.innerHTML = `<div class="alert alert-danger">Amount required.</div>`; return; }
            try {
                let url = `/api/update_payment?token=${encodeURIComponent(getToken())}&paymentId=${currentEditPayId}&amount=${amount}`;
                if (date) url += `&date=${date}`;
                const resp = await fetch(url);
                const text = await resp.text();
                if (resp.ok) {
                    bootstrap.Modal.getInstance(document.getElementById("editPayModal")).hide();
                    loadTimeline();
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        });

        document.getElementById("deletePayBtn").addEventListener("click", async () => {
            const alertBox = document.getElementById("editPayAlert");
            alertBox.innerHTML = "";
            try {
                const resp = await fetch(`/api/delete_payment?token=${encodeURIComponent(getToken())}&paymentId=${currentEditPayId}`);
                const text = await resp.text();
                if (resp.ok) {
                    bootstrap.Modal.getInstance(document.getElementById("editPayModal")).hide();
                    loadTimeline();
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        });

        document.getElementById("settleBtn").addEventListener("click", async () => {
            try {
                const results = await apiGet("/api/settle", { groupId });
                const container = document.getElementById("settleResults");
                if (results.length === 0) {
                    container.innerHTML = `<div class="alert alert-success">All balances are settled!</div>`;
                } else {
                    container.innerHTML = `<div class="card"><div class="card-body">
                        <h6>Settlements</h6>
                        <ul class="list-group list-group-flush">
                            ${results.map(s => `<li class="list-group-item d-flex justify-content-between">
                                <span>${escapeHtml(userName(s.from))} &rarr; ${escapeHtml(userName(s.to))}</span>
                                <span class="badge text-bg-warning">${formatAmount(s.amount)}</span>
                            </li>`).join("")}
                        </ul>
                    </div></div>`;
                }
            } catch (err) {
                document.getElementById("settleResults").innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        });

        document.getElementById("manageUsersBtn").addEventListener("click", () => {
            window.location.href = `/static/manage_users.html?groupId=${groupId}`;
        });

        (async () => {
            await loadGroupInfo();
            await loadUsers();
            await loadTimeline();
        })();
        })();
    </script>
</body>
</html>
