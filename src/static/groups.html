<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups - Transaction Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-secondary">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Transaction Manager</span>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-primary btn-sm" id="inviteBtn">Generate Invite Token</button>
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Your Groups</h3>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createGroupModal">+ New Group</button>
        </div>
        <div id="groupList" class="row g-3"></div>
    </div>

    <!-- Create Group Modal -->
    <div class="modal fade" id="createGroupModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Group</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="createAlertBox"></div>
                    <input type="text" class="form-control" id="groupName" placeholder="Group name">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="createGroupBtn">Create</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Invite Token Modal -->
    <div class="modal fade" id="inviteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Invite Token</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="inviteAlertBox"></div>
                    <p class="text-body-secondary">Share this token with the person you want to invite. They can use it at the <a href="/static/invite.html">Accept Invite</a> page.</p>
                    <input type="text" class="form-control" id="inviteToken" readonly>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="copyInviteBtn">Copy</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        (async () => {
        if (!await requireAuth()) return;

        async function loadGroups() {
            try {
                const groups = await apiGet("/api/get_groups");
                const container = document.getElementById("groupList");
                if (groups.length === 0) {
                    container.innerHTML = `<p class="text-body-secondary">You are not in any groups yet. Create one to get started.</p>`;
                    return;
                }
                container.innerHTML = groups.map(g => `
                    <div class="col-md-4">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">${escapeHtml(g.g_name)}</h5>
                                <a href="/static/group.html?groupId=${g.g_id}" class="btn btn-outline-primary btn-sm">Open</a>
                            </div>
                        </div>
                    </div>
                `).join("");
            } catch (err) {
                document.getElementById("groupList").innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        }

        document.getElementById("createGroupBtn").addEventListener("click", async () => {
            const name = document.getElementById("groupName").value.trim();
            const alertBox = document.getElementById("createAlertBox");
            alertBox.innerHTML = "";
            if (!name) { alertBox.innerHTML = `<div class="alert alert-danger">Please enter a group name.</div>`; return; }
            try {
                const resp = await fetch(`/api/create_group?token=${encodeURIComponent(getToken())}&name=${encodeURIComponent(name)}`);
                const text = await resp.text();
                if (resp.ok) {
                    bootstrap.Modal.getInstance(document.getElementById("createGroupModal")).hide();
                    document.getElementById("groupName").value = "";
                    loadGroups();
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        });

        document.getElementById("inviteBtn").addEventListener("click", async () => {
            const alertBox = document.getElementById("inviteAlertBox");
            alertBox.innerHTML = "";
            try {
                const resp = await fetch(`/api/create_invite_token?token=${encodeURIComponent(getToken())}`);
                const text = await resp.text();
                if (resp.ok) {
                    document.getElementById("inviteToken").value = text;
                    new bootstrap.Modal(document.getElementById("inviteModal")).show();
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        });

        document.getElementById("copyInviteBtn").addEventListener("click", () => {
            const input = document.getElementById("inviteToken");
            input.select();
            navigator.clipboard.writeText(input.value);
        });

        loadGroups();
        })();
    </script>
</body>
</html>
