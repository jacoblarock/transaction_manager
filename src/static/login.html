<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Transaction Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-secondary">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow" style="width: 400px;">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Login</h3>
                <div id="alertBox"></div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="loginBtn">Login</button>
                </form>
                <hr>
                <div class="text-center">
                    <small class="text-body-secondary">Have an invite token?</small>
                    <a href="/static/invite.html" class="d-block mt-1">Accept Invite</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("loginBtn");
            const alertBox = document.getElementById("alertBox");
            alertBox.innerHTML = "";
            btn.disabled = true;
            btn.textContent = "Logging in...";
            try {
                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;
                const passHash = await hashPassword(password);
                const resp = await fetch(`/api/authenticate?user=${encodeURIComponent(username)}&passHash=${encodeURIComponent(passHash)}`);
                const text = await resp.text();
                if (resp.ok) {
                    setToken(text);
                    setUsername(username);
                    window.location.href = "/static/groups.html";
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">An error occurred: ${escapeHtml(err.message)}</div>`;
            }
            btn.disabled = false;
            btn.textContent = "Login";
        });
    </script>
</body>
</html>
