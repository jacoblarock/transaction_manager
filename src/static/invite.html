<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Invite - Transaction Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-secondary">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow" style="width: 400px;">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Accept Invite</h3>
                <div id="alertBox"></div>
                <form id="inviteForm">
                    <div class="mb-3">
                        <label for="token" class="form-label">Invite Token</label>
                        <input type="text" class="form-control" id="token" required>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="submitBtn">Create Account</button>
                </form>
                <hr>
                <div class="text-center">
                    <small class="text-body-secondary">Already have an account?</small>
                    <a href="/static/login.html" class="d-block mt-1">Login</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        document.getElementById("inviteForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            const alertBox = document.getElementById("alertBox");
            alertBox.innerHTML = "";
            btn.disabled = true;
            btn.textContent = "Creating...";
            try {
                const token = document.getElementById("token").value;
                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;
                const passHash = await hashPassword(password);
                const url = `/api/create_user_from_invite_token?token=${encodeURIComponent(token)}&user=${encodeURIComponent(username)}&passHash=${encodeURIComponent(passHash)}`;
                const resp = await fetch(url);
                const text = await resp.text();
                if (resp.ok) {
                    alertBox.innerHTML = `<div class="alert alert-success">Account created! Redirecting to login...</div>`;
                    setTimeout(() => window.location.href = "/static/login.html", 2000);
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">An error occurred: ${escapeHtml(err.message)}</div>`;
            }
            btn.disabled = false;
            btn.textContent = "Create Account";
        });
    </script>
</body>
</html>
