<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Parts - Transaction Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-secondary">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <a href="/static/groups.html" class="navbar-brand mb-0 h1">Transaction Manager</a>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 id="txnTitle">Transaction Parts</h3>
            <a href="#" id="backLink" class="btn btn-outline-primary btn-sm">Back to Group</a>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <div id="txnInfo" class="row">
                    <div class="col-md-6">
                        <p class="mb-1"><strong>Name:</strong> <span id="txnName"></span></p>
                        <p class="mb-1"><strong>Paid by:</strong> <span id="txnPayer"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p class="mb-1"><strong>Total Amount:</strong> <span id="txnAmount" class="badge text-bg-primary fs-6"></span></p>
                        <p class="mb-1"><strong>Date:</strong> <span id="txnDate"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5>Transaction Parts</h5>
            <button class="btn btn-success btn-sm" id="addPartBtn">+ Add Part</button>
        </div>

        <div id="remainingAlert"></div>

        <div id="partsList" class="list-group"></div>
    </div>

    <!-- Add Part Modal -->
    <div class="modal fade" id="addPartModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Transaction Part</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="addPartAlert"></div>
                    <div class="mb-3">
                        <label class="form-label">User</label>
                        <select class="form-select" id="partUser"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" step="0.01" class="form-control" id="partAmount">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="savePartBtn">Add</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Part Modal -->
    <div class="modal fade" id="editPartModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Transaction Part</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="editPartAlert"></div>
                    <div class="mb-3">
                        <label class="form-label">User</label>
                        <select class="form-select" id="editPartUser"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" step="0.01" class="form-control" id="editPartAmount">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger me-auto" id="deletePartBtn">Delete</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="updatePartBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        (async () => {
        if (!await requireAuth()) return;
        const params = new URLSearchParams(window.location.search);
        const txnId = params.get("transactionId");
        const groupId = params.get("groupId");
        if (!txnId || !groupId) window.location.href = "/static/groups.html";

        document.getElementById("backLink").href = `/static/group.html?groupId=${groupId}`;

        let users = [];
        let currentUserId = null;
        let currentEditPartId = null;
        let txnAmount = 0;

        async function loadUsers() {
            try {
                users = await apiGet("/api/get_group_users", { groupId });
                const me = users.find(u => u.u_name === getUsername());
                currentUserId = me ? me.u_id : null;
            } catch {
                users = [];
            }
        }

        function userName(uid) {
            const u = users.find(x => x.u_id == uid);
            return u ? u.u_name : `User ${uid}`;
        }

        async function loadTransaction() {
            try {
                const txns = await apiGet("/api/get_transactions", { groupId });
                const t = txns.find(x => x.t_id == txnId);
                if (!t) {
                    document.getElementById("txnInfo").innerHTML = `<div class="alert alert-danger">Transaction not found.</div>`;
                    return;
                }
                txnAmount = parseFloat(t.t_amount);
                document.getElementById("txnTitle").textContent = `Parts: ${t.t_name}`;
                document.getElementById("txnName").textContent = t.t_name;
                document.getElementById("txnPayer").textContent = userName(t.t_u_ref);
                document.getElementById("txnAmount").textContent = formatAmount(t.t_amount);
                document.getElementById("txnDate").textContent = formatDate(t.t_date) || "N/A";
            } catch (err) {
                document.getElementById("txnInfo").innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        }

        async function loadParts() {
            try {
                const parts = await apiGet("/api/get_transaction_parts", { transactionId: txnId });
                const container = document.getElementById("partsList");
                const remainingContainer = document.getElementById("remainingAlert");

                if (parts.length === 0) {
                    container.innerHTML = `<p class="text-body-secondary">No parts yet. The full transaction amount will be split evenly among group members.</p>`;
                } else {
                    container.innerHTML = parts.map(p => {
                        const editBtn = `<button class="btn btn-outline-secondary btn-sm ms-2" onclick="openEditPart(${p.tp_id}, ${p.tp_u_ref}, ${p.tp_amount})">Edit</button>`;
                        return `<div class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${escapeHtml(userName(p.tp_u_ref))}</strong>
                                <small class="text-body-secondary d-block">Added ${formatDate(p.tp_created_at)}</small>
                            </div>
                            <div class="d-flex align-items-center">
                                <span class="badge text-bg-warning fs-6">${formatAmount(p.tp_amount)}</span>
                                ${editBtn}
                            </div>
                        </div>`;
                    }).join("");
                }

                const partsSum = parts.reduce((s, p) => s + parseFloat(p.tp_amount), 0);
                const remaining = txnAmount - partsSum;
                if (Math.abs(remaining) < 0.01) {
                    remainingContainer.innerHTML = `<div class="alert alert-success">All ${formatAmount(txnAmount)} is allocated.</div>`;
                } else if (remaining > 0) {
                    remainingContainer.innerHTML = `<div class="alert alert-info">${formatAmount(remaining)} remaining — will be split evenly among group members.</div>`;
                } else {
                    remainingContainer.innerHTML = `<div class="alert alert-warning">Parts exceed transaction total by ${formatAmount(Math.abs(remaining))}.</div>`;
                }
            } catch (err) {
                document.getElementById("partsList").innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        }

        document.getElementById("addPartBtn").addEventListener("click", async () => {
            document.getElementById("partAmount").value = "";
            document.getElementById("addPartAlert").innerHTML = "";
            await loadUsers();
            const sel = document.getElementById("partUser");
            sel.innerHTML = users.map(u => `<option value="${u.u_id}">${escapeHtml(u.u_name)}</option>`).join("");
            new bootstrap.Modal(document.getElementById("addPartModal")).show();
        });

        document.getElementById("savePartBtn").addEventListener("click", async () => {
            const userId = document.getElementById("partUser").value;
            const amount = document.getElementById("partAmount").value;
            const alertBox = document.getElementById("addPartAlert");
            alertBox.innerHTML = "";
            if (!amount) { alertBox.innerHTML = `<div class="alert alert-danger">Amount required.</div>`; return; }
            try {
                let url = `/api/create_transaction_part?token=${encodeURIComponent(getToken())}&transactionId=${txnId}&userId=${userId}&amount=${amount}`;
                const resp = await fetch(url);
                const text = await resp.text();
                if (resp.ok) {
                    bootstrap.Modal.getInstance(document.getElementById("addPartModal")).hide();
                    loadParts();
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        });

        window.openEditPart = function(partId, userId, amount) {
            currentEditPartId = partId;
            const sel = document.getElementById("editPartUser");
            sel.innerHTML = users.map(u => `<option value="${u.u_id}">${escapeHtml(u.u_name)}</option>`).join("");
            sel.value = userId;
            document.getElementById("editPartAmount").value = amount;
            document.getElementById("editPartAlert").innerHTML = "";
            new bootstrap.Modal(document.getElementById("editPartModal")).show();
        };

        document.getElementById("updatePartBtn").addEventListener("click", async () => {
            const userId = document.getElementById("editPartUser").value;
            const amount = document.getElementById("editPartAmount").value;
            const alertBox = document.getElementById("editPartAlert");
            alertBox.innerHTML = "";
            if (!amount) { alertBox.innerHTML = `<div class="alert alert-danger">Amount required.</div>`; return; }
            try {
                let url = `/api/update_transaction_part?token=${encodeURIComponent(getToken())}&partId=${currentEditPartId}&userId=${userId}&amount=${amount}`;
                const resp = await fetch(url);
                const text = await resp.text();
                if (resp.ok) {
                    bootstrap.Modal.getInstance(document.getElementById("editPartModal")).hide();
                    loadParts();
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        });

        document.getElementById("deletePartBtn").addEventListener("click", async () => {
            const alertBox = document.getElementById("editPartAlert");
            alertBox.innerHTML = "";
            try {
                const resp = await fetch(`/api/delete_transaction_part?token=${encodeURIComponent(getToken())}&partId=${currentEditPartId}`);
                const text = await resp.text();
                if (resp.ok) {
                    bootstrap.Modal.getInstance(document.getElementById("editPartModal")).hide();
                    loadParts();
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(text)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
            }
        });

        (async () => {
            await loadUsers();
            await loadTransaction();
            await loadParts();
        })();
        })();
    </script>
</body>
</html>
